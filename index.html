<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ONE LISTENER</title>
  <meta name="description" content="No followers. No numbers. No label. No pitch. Play me one thing." />
  <style>
    :root {
      --paper: #fff;
      --ink: #000;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Helvetica, Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 28px;
    }

    main {
      width: min(680px, 100%);
      min-height: 72vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .title {
      font-size: clamp(2.8rem, 8vw, 6rem);
      line-height: .86;
      letter-spacing: -0.075em;
      margin: 0;
      font-weight: 700;
      text-transform: uppercase;
    }

    .middle { margin: 64px 0; }

    .rules {
      margin: 0 0 42px;
      padding: 0;
      list-style: none;
      font-size: clamp(1rem, 2.4vw, 1.3rem);
      line-height: 1.55;
      font-weight: 400;
    }

    .prompt {
      font-size: clamp(2rem, 6vw, 4.3rem);
      line-height: .96;
      letter-spacing: -0.055em;
      margin: 0 0 30px;
      font-weight: 700;
    }

    .button,
    button {
      display: inline-block;
      border: 2px solid var(--ink);
      color: var(--ink);
      background: var(--paper);
      text-decoration: none;
      padding: 15px 19px 13px;
      font: inherit;
      font-size: .95rem;
      font-weight: 700;
      letter-spacing: -.01em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .12s ease, color .12s ease;
    }

    .button:hover,
    .button:focus-visible,
    button:hover,
    button:focus-visible {
      background: var(--ink);
      color: var(--paper);
      outline: none;
    }

    button:disabled {
      background: var(--ink);
      color: var(--paper);
      cursor: wait;
    }

    .screen[hidden] { display: none; }

    form {
      width: min(560px, 100%);
    }

    label {
      display: block;
      margin: 0 0 7px;
      font-size: .82rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      border: 0;
      border-bottom: 2px solid var(--ink);
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 1.15rem;
      padding: 10px 0;
      margin: 0 0 30px;
      outline: none;
    }

    input:focus { border-bottom-width: 4px; }

    .aside {
      margin: 24px 0 0;
      font-size: .78rem;
      line-height: 1.4;
    }

    .error {
      margin: 18px 0 0;
      font-size: .8rem;
      font-weight: 700;
    }

    footer {
      font-size: .78rem;
      color: var(--ink);
      font-weight: 400;
    }
  </style>
</head>
<body>
  <main>
    <h1 class="title">ONE<br>LISTENER</h1>

    <section class="middle screen" id="intro" aria-label="One Listener introduction">
      <ul class="rules">
        <li>No followers.</li>
        <li>No numbers.</li>
        <li>No label.</li>
        <li>No pitch.</li>
      </ul>

      <p class="prompt">Play me one thing.</p>
      <button type="button" id="open-form">Play something</button>
    </section>

    <section class="middle screen" id="submission" hidden aria-label="Submit one track">
      <p class="prompt">One track only.</p>

      <form id="track-form" action="https://formspree.io/f/xzebgbla" method="POST">
        <label for="track">Track link</label>
        <input id="track" name="track" type="url" inputmode="url" autocomplete="url" placeholder="https://" required />

        <label for="email">Your email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />

        <button type="submit" id="send-button">Send</button>
        <p class="aside">Don't tell me who you're supposed to be yet.</p>
        <p class="error" id="form-error" hidden>Something went wrong. Try again.</p>
      </form>
    </section>

    <section class="middle screen" id="success" hidden aria-live="polite">
      <p class="prompt">I'm listening.</p>
    </section>

    <footer>Someone will actually listen.</footer>
  </main>

  <script>
    const intro = document.getElementById('intro');
    const submission = document.getElementById('submission');
    const success = document.getElementById('success');
    const openForm = document.getElementById('open-form');
    const form = document.getElementById('track-form');
    const sendButton = document.getElementById('send-button');
    const formError = document.getElementById('form-error');

    openForm.addEventListener('click', () => {
      intro.hidden = true;
      submission.hidden = false;
      document.getElementById('track').focus();
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      formError.hidden = true;
      sendButton.disabled = true;
      sendButton.textContent = 'Listening…';

      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });

        if (!response.ok) throw new Error('Submission failed');

        submission.hidden = true;
        success.hidden = false;
        form.reset();
      } catch (error) {
        formError.hidden = false;
        sendButton.disabled = false;
        sendButton.textContent = 'Send';
      }
    });
  </script>
</body>
</html>
