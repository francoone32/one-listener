<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ONE LISTENER</title>
  <meta name="description" content="No followers. No numbers. No label. No pitch. Play me one thing." />
  <style>
    :root {
      --paper: #fff;
      --ink: #000;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Helvetica, Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 28px;
    }

    main {
      width: min(680px, 100%);
      min-height: 72vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .title {
      font-size: clamp(2.8rem, 8vw, 6rem);
      line-height: .86;
      letter-spacing: -0.075em;
      margin: 0;
      font-weight: 900;
      -webkit-text-stroke: .55px var(--ink);
      paint-order: stroke fill;
      text-transform: uppercase;
    }

    .middle { margin: 64px 0; }

    .rules {
      margin: 0 0 42px;
      padding: 0;
      list-style: none;
      font-size: clamp(1rem, 2.4vw, 1.3rem);
      line-height: 1.55;
      font-weight: 400;
    }

    .prompt {
      font-size: clamp(2rem, 6vw, 4.3rem);
      line-height: .96;
      letter-spacing: -0.055em;
      margin: 0 0 30px;
      font-weight: 700;
    }

    .hero-prompt {
      font-weight: 900;
      -webkit-text-stroke: .35px var(--ink);
      paint-order: stroke fill;
    }

    .button,
    button {
      display: inline-block;
      border: 2px solid var(--ink);
      color: var(--ink);
      background: var(--paper);
      text-decoration: none;
      padding: 15px 19px 13px;
      font: inherit;
      font-size: .95rem;
      font-weight: 700;
      letter-spacing: -.01em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .12s ease, color .12s ease;
    }

    .button:hover,
    .button:focus-visible,
    button:hover,
    button:focus-visible {
      background: var(--ink);
      color: var(--paper);
      outline: none;
    }

    button:disabled {
      background: var(--ink);
      color: var(--paper);
      cursor: wait;
    }

    .screen[hidden] { display: none; }

    form { width: min(560px, 100%); }

    label {
      display: block;
      margin: 0 0 7px;
      font-size: .82rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      border: 0;
      border-bottom: 2px solid var(--ink);
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 1.15rem;
      padding: 10px 0;
      margin: 0 0 30px;
      outline: none;
    }

    input:focus { border-bottom-width: 4px; }

    .aside {
      margin: 24px 0 0;
      font-size: .78rem;
      line-height: 1.4;
    }

    .error {
      margin: 18px 0 0;
      font-size: .8rem;
      font-weight: 700;
    }

    .cassette-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 22px;
    }

    .cassette {
      width: min(330px, 82vw);
      aspect-ratio: 1.65 / 1;
      border: 5px solid var(--ink);
      position: relative;
      background: var(--paper);
      animation: cassette-in .34s cubic-bezier(.2,.8,.2,1) both;
    }

    .cassette::before {
      content: "";
      position: absolute;
      left: 9%;
      right: 9%;
      top: 14%;
      height: 46%;
      border: 3px solid var(--ink);
    }

    .cassette::after {
      content: "";
      position: absolute;
      left: 20%;
      right: 20%;
      bottom: 10%;
      height: 18%;
      border: 3px solid var(--ink);
      transform: perspective(100px) rotateX(8deg);
    }

    .reel {
      position: absolute;
      top: 27%;
      width: 18%;
      aspect-ratio: 1;
      border: 4px solid var(--ink);
      border-radius: 50%;
      z-index: 2;
      animation: reel-spin 1.5s linear infinite;
    }

    .reel::before,
    .reel::after {
      content: "";
      position: absolute;
      background: var(--ink);
      left: 50%;
      top: 50%;
      transform-origin: center;
    }

    .reel::before {
      width: 72%;
      height: 3px;
      transform: translate(-50%, -50%);
    }

    .reel::after {
      width: 3px;
      height: 72%;
      transform: translate(-50%, -50%);
    }

    .reel.left { left: 20%; }
    .reel.right { right: 20%; }

    .tape-line {
      position: absolute;
      left: 37%;
      right: 37%;
      top: 38%;
      border-top: 4px solid var(--ink);
      z-index: 2;
    }

    .cassette-status {
      margin: 0;
      font-size: .95rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: -.01em;
    }

    @keyframes reel-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes cassette-in {
      from { transform: translateY(18px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .reel, .cassette { animation: none; }
    }

    footer {
      font-size: .78rem;
      color: var(--ink);
      font-weight: 400;
    }
  </style>
</head>
<body>
  <main>
    <h1 class="title">ONE<br>LISTENER</h1>

    <section class="middle screen" id="intro" aria-label="One Listener introduction">
      <ul class="rules">
        <li>No followers.</li>
        <li>No numbers.</li>
        <li>No label.</li>
        <li>No pitch.</li>
      </ul>

      <p class="prompt hero-prompt">Play me one thing.</p>
      <button type="button" id="open-form">Play something</button>
    </section>

    <section class="middle screen" id="submission" hidden aria-label="Submit one track">
      <p class="prompt">One track only.</p>

      <form id="track-form" action="https://formspree.io/f/xzebgbla" method="POST">
        <label for="track">Track link</label>
        <input id="track" name="track" type="url" inputmode="url" autocomplete="url" placeholder="https://" required />

        <label for="email">Your email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />

        <button type="submit" id="send-button">Send</button>
        <p class="aside">Don't tell me who you're supposed to be yet.</p>
        <p class="error" id="form-error" hidden>Something went wrong. Try again.</p>
      </form>
    </section>

    <section class="middle screen" id="loading" hidden aria-live="polite" aria-label="Listening">
      <div class="cassette-wrap">
        <div class="cassette" aria-hidden="true">
          <span class="reel left"></span>
          <span class="reel right"></span>
          <span class="tape-line"></span>
        </div>
        <p class="cassette-status">Listening…</p>
      </div>
    </section>

    <section class="middle screen" id="success" hidden aria-live="polite">
      <p class="prompt">I'm listening.</p>
    </section>

    <footer>Someone will actually listen.</footer>
  </main>

  <script>
    const intro = document.getElementById('intro');
    const submission = document.getElementById('submission');
    const loading = document.getElementById('loading');
    const success = document.getElementById('success');
    const openForm = document.getElementById('open-form');
    const form = document.getElementById('track-form');
    const sendButton = document.getElementById('send-button');
    const formError = document.getElementById('form-error');

    const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    function playCassetteInsertSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;

        const ctx = new AudioContext();
        const master = ctx.createGain();
        master.gain.setValueAtTime(0.12, ctx.currentTime);
        master.connect(ctx.destination);
        const now = ctx.currentTime;

        const noiseBurst = (time, duration, cutoff, volume) => {
          const frames = Math.max(1, Math.floor(ctx.sampleRate * duration));
          const buffer = ctx.createBuffer(1, frames, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < frames; i++) data[i] = Math.random() * 2 - 1;

          const source = ctx.createBufferSource();
          const filter = ctx.createBiquadFilter();
          const gain = ctx.createGain();
          source.buffer = buffer;
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(cutoff, time);
          gain.gain.setValueAtTime(volume, time);
          gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);
          source.connect(filter);
          filter.connect(gain);
          gain.connect(master);
          source.start(time);
          source.stop(time + duration);
        };

        const thunk = (time, fromHz, toHz, duration, volume) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(fromHz, time);
          osc.frequency.exponentialRampToValueAtTime(toHz, time + duration);
          gain.gain.setValueAtTime(volume, time);
          gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);
          osc.connect(gain);
          gain.connect(master);
          osc.start(time);
          osc.stop(time + duration);
        };

        // Plastic door contact, transport catches the cassette, then the latch seats.
        noiseBurst(now, 0.045, 2600, 0.35);
        noiseBurst(now + 0.075, 0.09, 900, 0.48);
        thunk(now + 0.06, 115, 58, 0.15, 0.75);
        noiseBurst(now + 0.22, 0.035, 3400, 0.28);
        thunk(now + 0.215, 82, 52, 0.08, 0.42);

        setTimeout(() => ctx.close().catch(() => {}), 700);
      } catch (_) {
        // Decorative only. Submission never depends on sound.
      }
    }

    openForm.addEventListener('click', () => {
      intro.hidden = true;
      submission.hidden = false;
      document.getElementById('track').focus();
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      formError.hidden = true;
      sendButton.disabled = true;
      submission.hidden = true;
      loading.hidden = false;
      playCassetteInsertSound();

      try {
        const submissionRequest = fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });

        const [response] = await Promise.all([
          submissionRequest,
          wait(3000)
        ]);

        if (!response.ok) throw new Error('Submission failed');

        loading.hidden = true;
        success.hidden = false;
        form.reset();
        sendButton.disabled = false;
      } catch (error) {
        loading.hidden = true;
        submission.hidden = false;
        formError.hidden = false;
        sendButton.disabled = false;
      }
    });
  </script>
</body>
</html>
